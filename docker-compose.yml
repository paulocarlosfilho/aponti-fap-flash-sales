networks:
  flash-sales-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
  localstackdata:

services:
  # --- BANCO DE DADOS E CACHE ---
  postgres:
    image: postgres:16-alpine
    container_name: flash-sales-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flash_sales
      POSTGRES_USER: flash_sales_user
      POSTGRES_PASSWORD: flash_sales_pass123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash_sales_user -d flash_sales"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flash-sales-net

  redis:
    image: redis:7-alpine
    container_name: flash-sales-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flash-sales-net

  # --- APLICAÇÃO ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flash-sales-api:local
    container_name: flash-sales-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flash_sales
      DB_USER: flash_sales_user
      DB_PASSWORD: flash_sales_pass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - flash-sales-net

  # --- OBSERVABILIDADE (PROMETHEUS & GRAFANA) ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: flash-sales-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - flash-sales-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: flash-sales-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - flash-sales-net

  # --- SIMULADOR DE NUVEM (LOCALSTACK) ---
  # Opcional: remova este serviço se o projeto não usar nenhum recurso AWS.
  localstack:
    image: localstack/localstack:3.7
    container_name: flash-sales-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3,ec2
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    networks:
      - flash-sales-net